# Публикация прототипа на GitHub Pages: каждый пуш в main → сборка Vite → https://popkovakat99.github.io/Lesson4/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # сайт живёт в подпапке репозитория
          BASE_PATH: /${{ github.event.repository.name }}/
          # адрес сбора юзер-тестов (ngrok-туннель к сборщику на VPS); не секрет — его видно в коде страницы
          UT_ENDPOINT: https://hungry-routing-taste.ngrok-free.dev/collect
      # SPA-fallback: GitHub Pages на неизвестный путь отдаёт 404.html — кладём туда то же приложение
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
